name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Update ext.json URLs for GitHub Pages
        run: |
          PAGES_URL="https://lcominetti.github.io/sn-markdown-reborn"
          jq \
            --arg url "$PAGES_URL/" \
            --arg latest "$PAGES_URL/ext.json" \
            '.url = $url | .download_url = $url | .latest_url = $latest | .marketing_url = $url' \
            ext.json > ext.json.tmp
          mv ext.json.tmp ext.json
          cat ext.json

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp ext.json _site/
          cp -r dist _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
